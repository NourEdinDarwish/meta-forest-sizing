name: Forest saving example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          packages: |
            guido-s/meta@7033a54d613d90aa9633372134070be4d3220c6a
            any::ragg
          dependencies: 'NA'
      - run: Rscript --vanilla reproduce.R
      - uses: actions/upload-artifact@v7
        with:
          name: forest-${{ matrix.os }}
          path: results/
